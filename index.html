<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Diwali — Festival of Lights</title>
<style>
  :root {
    --night: #1A0B33;
    --marigold: #FFB627;
    --flame: #FFD98A;
    --rose: #FF4D8D;
    --ink: #FFF4E0;
    --serif: "Palatino Linotype", "Book Antiqua", Palatino, "URW Palladio L", Georgia, serif;
    --deva: "Nirmala UI", "Kohinoor Devanagari", "Noto Sans Devanagari", "Mangal", sans-serif;
    --beng: "Nirmala UI", "Kohinoor Bangla", "Bangla MN", "Noto Sans Bengali", "Shonar Bangla", "Vrinda", sans-serif;
    --ui: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--night); color: var(--ink); }
  body { font-family: var(--ui); cursor: crosshair; user-select: none; }
  body.idle { cursor: none; }

  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Greeting ---------- */
  .greeting {
    position: fixed; left: 50%; top: 47%;
    transform: translate(-50%, -50%);
    width: min(92vw, 1150px);
    text-align: center;
    pointer-events: none;
    transition: opacity .8s ease;
    z-index: 2;
  }
  .greeting::before {
    content: ""; position: absolute; inset: -12% -6%;
    background: radial-gradient(ellipse at center, rgba(22,6,42,.62) 0%, rgba(22,6,42,.3) 45%, rgba(22,6,42,0) 72%);
    z-index: -1;
  }
  .greeting.hidden { opacity: 0; }

  .hi {
    display: grid; justify-items: center;
    font-size: clamp(22px, 2.5vw, 46px);
    color: var(--flame);
    letter-spacing: .03em;
    text-shadow: 0 0 18px rgba(255,170,40,.7);
    margin-bottom: .2em;
    opacity: 0; animation: rise 1.4s ease-out 1.9s forwards;
  }
  .hi-line {
    grid-area: 1 / 1;
    opacity: 0; filter: blur(6px); transform: translateY(6px);
    transition: opacity 1.1s ease, filter 1.1s ease, transform 1.1s ease;
  }
  .hi-line.show { opacity: 1; filter: none; transform: none; }
  .hi-line.deva { font-family: var(--deva); }
  .hi-line.beng { font-family: var(--beng); }
  .title {
    font-family: var(--serif);
    font-style: italic; font-weight: 400;
    font-size: clamp(64px, 10.5vw, 200px);
    line-height: 1.02;
    filter: drop-shadow(0 0 22px rgba(255,170,40,.55)) drop-shadow(0 0 70px rgba(255,110,30,.35));
    white-space: nowrap;
  }
  .title span {
    display: inline-block;
    padding: 0 .07em; margin: 0 -.07em;
    background: linear-gradient(180deg, #FFF8E2 8%, #FFD27A 48%, #F29A1C 92%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    opacity: 0;
    animation: lamp 1.2s ease-out forwards;
  }
  .msg {
    font-family: var(--serif);
    font-size: clamp(17px, 1.55vw, 28px);
    line-height: 1.55;
    max-width: 38ch; margin: .9em auto 0;
    color: rgba(255,244,224,.9);
    text-shadow: 0 2px 14px rgba(20,4,40,.9);
    opacity: 0; animation: rise 1.4s ease-out 2.5s forwards;
  }
  .from {
    font-family: var(--serif); font-style: italic;
    font-size: clamp(15px, 1.2vw, 22px);
    color: var(--marigold);
    margin-top: .9em;
    text-shadow: 0 2px 12px rgba(20,4,40,.9);
    opacity: 0; animation: rise 1.4s ease-out 3s forwards;
  }
  @keyframes lamp {
    0%   { opacity: 0; filter: blur(12px) brightness(2.6); transform: translateY(.08em); }
    55%  { opacity: 1; filter: blur(0) brightness(1.7); transform: none; }
    100% { opacity: 1; filter: none; transform: none; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  body.editing .greeting { pointer-events: auto; }
  body.editing .editable { user-select: text; }
  .editable[contenteditable="true"] {
    outline: 1px dashed rgba(255,182,39,.7); outline-offset: 8px; border-radius: 6px; cursor: text;
    caret-color: var(--marigold);
  }

  /* ---------- Control dock ---------- */
  .dock {
    position: fixed; right: 24px; bottom: 24px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    z-index: 5;
    max-width: min(760px, calc(100vw - 48px));
    pointer-events: none;
  }
  /* hint always shows; button row shows only after Ctrl+Esc */
  .dock .row {
    opacity: 0; visibility: hidden; max-height: 0; margin-top: -10px; overflow: hidden;
    padding-block: 0; border-width: 0;
    transition: opacity .6s ease, max-height .6s ease, margin-top .6s ease, visibility 0s .6s;
  }
  body.dock-open .dock .row {
    opacity: 1; visibility: visible; max-height: 240px; margin-top: 0; pointer-events: auto;
    padding-block: 8px; border-width: 1px;
    transition: opacity .6s ease, max-height .6s ease, margin-top .6s ease, visibility 0s;
  }
  .hint { font-size: 13px; color: rgba(255,244,224,.75); text-shadow: 0 1px 8px #12052a; text-align: right; }
  .row {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
    padding: 8px; border-radius: 18px;
    background: rgba(26,8,48,.66);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,182,39,.22);
    box-shadow: 0 10px 40px rgba(10,2,24,.5);
  }
  .row button {
    font: 500 14px/1 var(--ui);
    color: var(--ink);
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,244,224,.12);
    padding: 10px 12px; border-radius: 12px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    transition: background .2s, border-color .2s;
  }
  .row button:hover { background: rgba(255,182,39,.16); }
  .row button[aria-pressed="true"] { border-color: rgba(255,182,39,.75); color: #FFE3A3; }
  .row button:focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; }
  kbd {
    font: 600 11px/1 var(--ui); color: rgba(255,244,224,.65);
    border: 1px solid rgba(255,244,224,.25); border-radius: 5px; padding: 3px 5px;
  }

  @media (prefers-reduced-motion: reduce) {
    .hi, .msg, .from, .title span { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>

<main class="greeting" id="greeting">
  <p class="hi" id="hi">
    <span class="hi-line deva show" lang="hi">शुभ दीपावली</span>
    <span class="hi-line beng" lang="bn" aria-hidden="true">শুভ দীপাবলি</span>
  </p>
  <h1 class="title" id="title">Happy Diwali</h1>
  <p class="msg editable" id="msg">May the light of every diya fill your home with joy, your work with purpose, and your year with prosperity.</p>
  <p class="from editable" id="from">With warm wishes from all of us</p>
</main>

<div class="dock" id="dock">
  <p class="hint">Click anywhere in the sky to launch a firework. Click a diya to make it flare.</p>
  <div class="row">
    <button id="bFinale" title="Launch a grand finale">Grand finale <kbd>Space</kbd></button>
    <button id="bAuto" aria-pressed="true">Auto fireworks: on <kbd>A</kbd></button>
    <button id="bLights">Lights: auto <kbd>L</kbd></button>
    <button id="bEdit">Edit message <kbd>E</kbd></button>
    <button id="bHide">Hide message <kbd>H</kbd></button>
    <button id="bFull">Full screen <kbd>F</kbd></button>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =========================================================
     Setup
     ========================================================= */
  const sky  = document.getElementById('sky');
  const ctx  = sky.getContext('2d');
  const fwc  = document.createElement('canvas');   // fireworks layer with trails
  const fctx = fwc.getContext('2d');
  const bg   = document.createElement('canvas');   // static night-sky gradient
  const rg   = document.createElement('canvas');   // pre-rendered rangoli

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const COLORS = [
    [255,182, 39],  // 0 marigold
    [255, 77,141],  // 1 rose
    [ 46,214,196],  // 2 peacock teal
    [255,110, 48],  // 3 saffron
    [180,130,255],  // 4 lavender
    [120,255,110],  // 5 parrot green
    [255,232,120],  // 6 warm yellow
    [ 80,160,255],  // 7 sapphire
    [255,248,230]   // 8 warm white
  ];
  const NC = 8; // number of "party" colors (white excluded)
  const COLSTR = COLORS.map(c => `rgb(${c[0]},${c[1]},${c[2]})`);
  const SPR = COLORS.map(makeGlow);

  function makeGlow([r, g, b]) {
    const s = 64, c = document.createElement('canvas');
    c.width = c.height = s;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    gr.addColorStop(0,    'rgba(255,255,255,1)');
    gr.addColorStop(0.1,  `rgba(${r},${g},${b},1)`);
    gr.addColorStop(0.32, `rgba(${r},${g},${b},.38)`);
    gr.addColorStop(0.6,  `rgba(${r},${g},${b},.1)`);
    gr.addColorStop(1,    `rgba(${r},${g},${b},0)`);
    x.fillStyle = gr; x.fillRect(0, 0, s, s);
    return c;
  }
  function glow(c2, ci, x, y, size, a) {
    if (a <= 0.004) return;
    c2.globalAlpha = a > 1 ? 1 : a;
    c2.drawImage(SPR[ci], x - size/2, y - size/2, size, size);
  }

  const state = {
    autoFw: !reduceMotion,
    pattern: 'auto',        // auto | twinkle | chase | wave | breathe
    textHidden: false,
    editing: false
  };
  const PATTERNS = ['auto', 'twinkle', 'chase', 'wave', 'breathe'];
  const PATTERN_NAMES = { auto: 'auto', twinkle: 'twinkle', chase: 'chase', wave: 'color wave', breathe: 'breathe' };

  let W = 0, H = 0, DPR = 1, T = 0, R = 0;
  let stars = [], bokeh = [], swags = [], curtains = [], diyas = [], lanterns = [];
  let rockets = [], parts = [];
  let pointer = { x: -999, y: -999, lastMove: -10 };

  /* =========================================================
     Build scene
     ========================================================= */
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    const budget = 4.2e6; // pixel budget keeps 4K office screens smooth
    if (W * H * DPR * DPR > budget) DPR = Math.max(0.75, Math.sqrt(budget / (W * H)));
    for (const c of [sky, fwc, bg]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildSky(); buildStars(); buildBokeh(); buildStrings(); buildDiyas(); buildRangoli();
  }

  function buildSky() {
    const b = bg.getContext('2d');
    b.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = b.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,   '#0A0420');
    g.addColorStop(0.45,'#1D0A3B');
    g.addColorStop(0.8, '#3A1242');
    g.addColorStop(1,   '#5C1E2C');
    b.fillStyle = g; b.fillRect(0, 0, W, H);
    // warm horizon glow from the diyas
    const r = b.createRadialGradient(W/2, H*1.08, 0, W/2, H*1.08, Math.max(W, H) * 0.75);
    r.addColorStop(0, 'rgba(255,140,50,.38)');
    r.addColorStop(1, 'rgba(255,140,50,0)');
    b.fillStyle = r; b.fillRect(0, 0, W, H);
    // faint violet haze patches
    for (let i = 0; i < 5; i++) {
      const x = rand(0, W), y = rand(0, H * 0.6), rad = rand(W*0.15, W*0.35);
      const h = b.createRadialGradient(x, y, 0, x, y, rad);
      h.addColorStop(0, i % 2 ? 'rgba(120,40,160,.12)' : 'rgba(200,60,120,.08)');
      h.addColorStop(1, 'rgba(0,0,0,0)');
      b.fillStyle = h; b.fillRect(0, 0, W, H);
    }
  }

  function buildStars() {
    stars = [];
    const n = Math.round(clamp(W * H / 6000, 120, 420));
    for (let i = 0; i < n; i++) {
      stars.push({ x: rand(0, W), y: Math.pow(Math.random(), 1.6) * H * 0.7, r: rand(0.4, 1.4), ph: rand(0, TAU), sp: rand(0.5, 2) });
    }
  }

  function buildBokeh() {
    bokeh = [];
    const n = Math.round(clamp(W * H / 800, 700, 2600));
    for (let i = 0; i < n; i++) {
      const big = Math.random() < 0.07;
      const x = rand(0, W), y = rand(0, H);
      // dim lights behind the greeting so the message stays legible
      const dx = (x - W/2) / (W * 0.34), dy = (y - H * 0.47) / (H * 0.27);
      const d = Math.sqrt(dx*dx + dy*dy);
      const dim = d < 1 ? 0.2 + 0.8 * d * d : 1;
      bokeh.push({
        x, y, big,
        c: Math.random() * NC | 0,
        s: big ? rand(30, 85) : rand(5, 16),
        a: (big ? 0.1 : 0.6) * dim,
        ph: rand(0, TAU),
        sp: rand(0.6, 3.2),
        blink: !big && Math.random() < 0.3,
        vy: big ? -rand(3, 10) : 0
      });
    }
  }

  function buildStrings() {
    swags = []; curtains = [];
    const rows = [
      { n: 3, sag: H * 0.25, off: 0,   scale: 0.85, mode: 'multi' },
      { n: 4, sag: H * 0.15, off: 0.5, scale: 1.0,  mode: 'multi' },
      { n: 6, sag: H * 0.075,off: 0,   scale: 1.1,  mode: 'gold'  }
    ];
    let si = 0;
    for (const row of rows) {
      const seg = W / row.n;
      for (let i = -1; i <= row.n; i++) {
        const ax = (i + row.off) * seg, bx = ax + seg;
        if (bx < 0 || ax > W) continue;
        const ay = -4, by = -4;
        const cx = (ax + bx) / 2, cy = ay + row.sag * 2;
        const len = seg * 1.15 + row.sag;
        const n = Math.max(6, Math.round(len / (28 * row.scale)));
        const bulbs = [];
        for (let k = 0; k < n; k++) bulbs.push(row.mode === 'gold' ? (k % 2 ? 6 : 0) : (k + si) % NC);
        swags.push({ ax, ay, bx, by, cx, cy, scale: row.scale, ph: rand(0, TAU), si: si++, bulbs,
                     px: new Float32Array(n), py: new Float32Array(n), cyNow: cy });
      }
    }
    // curtain strands on both sides
    const region = clamp(W * 0.13, 120, 320), gap = 22;
    const strands = Math.max(4, Math.floor(region / gap));
    for (let side = 0; side < 2; side++) {
      for (let j = 0; j < strands; j++) {
        const fromEdge = j / strands;
        const x = side === 0 ? 12 + j * gap : W - 12 - j * gap;
        const len = H * (0.78 - 0.45 * fromEdge) + rand(-H * 0.04, H * 0.04);
        const step = 26, n = Math.max(3, Math.floor(len / step));
        curtains.push({ x, len, gap: step, ph: rand(0, TAU), si: si++, c: (j * 3 + side) % NC,
                        n, px: new Float32Array(n), py: new Float32Array(n) });
      }
    }
  }

  function buildDiyas() {
    const n = clamp(Math.floor(W / 140), 6, 22);
    const spacing = W / n;
    const s = clamp(spacing * 0.5, 46, 82);
    diyas = [];
    for (let i = 0; i < n; i++) {
      diyas.push({ x: (i + 0.5) * spacing - s * 0.08, y: H - s * 0.55 - 20, s,
                   ph: rand(0, 100), litAt: 0.5 + i * (1.6 / n), flare: 0 });
    }
  }

  function buildRangoli() {
    R = Math.min(W, H) * 0.36;
    const size = Math.ceil(R * 2 * DPR);
    rg.width = rg.height = size;
    const g = rg.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.translate(R, R);
    g.lineWidth = 1.6;
    const ring = (count, r0, len, wid, rgb, fillA, offset = 0) => {
      for (let i = 0; i < count; i++) {
        g.save();
        g.rotate((i + offset) / count * TAU);
        g.beginPath();
        g.moveTo(0, -r0);
        g.quadraticCurveTo(wid, -(r0 + len / 2), 0, -(r0 + len));
        g.quadraticCurveTo(-wid, -(r0 + len / 2), 0, -r0);
        g.fillStyle = `rgba(${rgb},${fillA})`; g.fill();
        g.strokeStyle = `rgba(${rgb},1)`; g.stroke();
        g.restore();
      }
    };
    const circle = (r, rgb, w = 1.6) => { g.beginPath(); g.arc(0, 0, r, 0, TAU); g.lineWidth = w; g.strokeStyle = `rgb(${rgb})`; g.stroke(); g.lineWidth = 1.6; };
    ring(32, R * 0.80, R * 0.15, R * 0.035, '255,77,141', 0.25);
    circle(R * 0.78, '255,182,39', 2);
    ring(16, R * 0.54, R * 0.24, R * 0.09, '255,182,39', 0.22);
    ring(16, R * 0.56, R * 0.18, R * 0.04, '255,110,48', 0.3, 0.5);
    circle(R * 0.52, '46,214,196');
    ring(12, R * 0.30, R * 0.22, R * 0.08, '46,214,196', 0.25);
    ring(8,  R * 0.09, R * 0.21, R * 0.07, '180,130,255', 0.3);
    for (let i = 0; i < 64; i++) {
      const a = i / 64 * TAU;
      g.beginPath(); g.arc(Math.cos(a) * R * 0.98, Math.sin(a) * R * 0.98, R * 0.012, 0, TAU);
      g.fillStyle = i % 2 ? '#FFE8A0' : '#FF4D8D'; g.fill();
    }
    g.beginPath(); g.arc(0, 0, R * 0.07, 0, TAU); g.fillStyle = '#FFB627'; g.fill();
  }

  /* =========================================================
     Light patterns
     ========================================================= */
  let bc = 0, ba = 1;
  function activePattern() {
    if (state.pattern !== 'auto') return state.pattern;
    return PATTERNS[1 + (Math.floor(T / 12) % 4)];
  }
  function bulbState(mode, k, si, c, ph) {
    switch (mode) {
      case 'twinkle': {
        const v = 0.5 + 0.5 * Math.sin(T * (1.4 + (ph % 2)) + ph * 9);
        bc = c; ba = 0.3 + 0.7 * v * v; break;
      }
      case 'chase': {
        const v = ((k - T * 9 + si * 2) % 5 + 5) % 5;
        bc = c; ba = v < 1.7 ? 1 : 0.16; break;
      }
      case 'wave': {
        bc = (Math.floor(k / 3 + T * 3.5 + si)) % NC; ba = 0.9; break;
      }
      case 'breathe': {
        bc = c; ba = 0.22 + 0.78 * (0.5 + 0.5 * Math.sin(T * 1.8 + si * 1.3)); break;
      }
    }
  }
  function drawBulb(x, y, scale, mode, k, si, c, ph) {
    bulbState(mode, k, si, c, ph);
    const by = y + 3 * scale;
    glow(ctx, bc, x, by, 30 * scale * (0.5 + 0.5 * ba), ba * 0.95);
    ctx.globalAlpha = 0.35 + 0.65 * ba;
    ctx.fillStyle = COLSTR[bc];
    ctx.beginPath();
    ctx.ellipse(x, by, 2.4 * scale, 3.4 * scale, 0, 0, TAU);
    ctx.fill();
  }

  /* =========================================================
     Fireworks & particles
     ========================================================= */
  function launch(tx, ty) {
    const sx = clamp(tx + rand(-W * 0.08, W * 0.08), 20, W - 20);
    rockets.push({ sx, sy: H + 10, tx, ty, x: sx, y: H + 10, t: 0, d: rand(0.85, 1.3), wob: rand(0, TAU) });
  }

  function addPart(p) { if (parts.length < 5000) parts.push(p); }

  function explode(x, y) {
    const types = ['peony', 'ring', 'willow', 'chrys', 'double'];
    const type = types[Math.random() * types.length | 0];
    const c1 = Math.random() * NC | 0;
    let c2 = Math.random() * NC | 0; if (c2 === c1) c2 = (c1 + 3) % NC;
    const base = Math.min(W, H) * rand(0.3, 0.42);

    // flash
    addPart({ x, y, vx: 0, vy: 0, life: 0.18, max: 0.18, c: 8, size: base * 0.8, drag: 0, g: 0, flick: false });

    if (type === 'ring') {
      const n = 80, tilt = rand(0.45, 1), rot = rand(0, TAU);
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU;
        let vx = Math.cos(a) * base, vy = Math.sin(a) * base * tilt;
        const cr = Math.cos(rot), sr = Math.sin(rot);
        addPart({ x, y, vx: vx * cr - vy * sr, vy: vx * sr + vy * cr, life: rand(1.2, 1.6), max: 1.6, c: i % 2 ? c1 : c2, size: 12, drag: 0.965, g: 60, flick: false });
      }
    } else if (type === 'willow') {
      for (let i = 0; i < 140; i++) {
        const a = rand(0, TAU), sp = base * 0.6 * Math.sqrt(Math.random());
        addPart({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(2.2, 3), max: 3, c: Math.random() < 0.8 ? 0 : 6, size: 10, drag: 0.975, g: 75, flick: true });
      }
    } else if (type === 'double') {
      for (let i = 0; i < 110; i++) {
        const a = rand(0, TAU), sp = base * rand(0.75, 1);
        addPart({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(1.3, 1.8), max: 1.8, c: c1, size: 12, drag: 0.965, g: 65, flick: false });
      }
      for (let i = 0; i < 60; i++) {
        const a = rand(0, TAU), sp = base * rand(0.3, 0.45);
        addPart({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(1.1, 1.5), max: 1.5, c: c2, size: 12, drag: 0.965, g: 65, flick: false });
      }
    } else {
      const flick = type === 'chrys';
      const n = 150;
      for (let i = 0; i < n; i++) {
        const a = rand(0, TAU), sp = base * (0.55 + 0.45 * Math.random());
        addPart({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(1.2, 1.9), max: 1.9, c: flick && i % 3 === 0 ? 8 : (i % 2 ? c1 : c2), size: 11, drag: 0.965, g: 70, flick });
      }
    }
  }

  function sparkle(x, y, n, spread = 1, up = 0) {
    for (let i = 0; i < n; i++) {
      addPart({ x, y, vx: rand(-70, 70) * spread, vy: rand(-90, 40) * spread - up,
                life: rand(0.35, 0.8), max: 0.8, c: Math.random() < 0.7 ? 0 : 8, size: rand(5, 9), drag: 0.95, g: 220, flick: true });
    }
  }

  function finale() {
    for (let i = 0; i < 14; i++) {
      setTimeout(() => launch(rand(W * 0.1, W * 0.9), rand(H * 0.1, H * 0.42)), i * 150);
    }
  }

  /* =========================================================
     Drawing helpers
     ========================================================= */
  function drawDiya(d) {
    const { x, y, s } = d;
    const w = s, h = s * 0.42;
    const tipX = x + w * 0.62, tipY = y - h * 0.42;
    const lit = T >= d.litAt;

    // ground reflection
    ctx.globalCompositeOperation = 'lighter';
    if (lit) glow(ctx, 3, x, y + h * 0.9, s * 2.6, 0.22);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    const body = ctx.createLinearGradient(0, y - h * 0.3, 0, y + h);
    body.addColorStop(0, '#DD6A3C'); body.addColorStop(0.5, '#8E2C17'); body.addColorStop(1, '#4A130B');

    // spout
    ctx.beginPath();
    ctx.moveTo(x + w * 0.30, y - h * 0.18);
    ctx.quadraticCurveTo(x + w * 0.52, y - h * 0.2, tipX, tipY);
    ctx.quadraticCurveTo(x + w * 0.56, y + h * 0.12, x + w * 0.36, y + h * 0.22);
    ctx.closePath();
    ctx.fillStyle = body; ctx.fill();

    // bowl
    ctx.beginPath();
    ctx.ellipse(x, y, w / 2, h, 0, 0, Math.PI);
    ctx.closePath();
    ctx.fillStyle = body; ctx.fill();

    // painted band and dots
    ctx.beginPath();
    ctx.ellipse(x, y, w * 0.4, h * 0.6, 0, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.strokeStyle = '#F2B64A'; ctx.lineWidth = Math.max(1.5, s * 0.03); ctx.stroke();
    ctx.fillStyle = '#FFE3A3';
    for (let i = 0; i < 7; i++) {
      const a = (0.2 + i * 0.1) * Math.PI;
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * w * 0.3, y + Math.sin(a) * h * 0.42, s * 0.018, 0, TAU); ctx.fill();
    }

    // rim and oil
    ctx.beginPath(); ctx.ellipse(x, y, w / 2, h * 0.26, 0, 0, TAU);
    ctx.fillStyle = '#E88A4E'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(x, y, w * 0.41, h * 0.17, 0, 0, TAU);
    ctx.fillStyle = lit ? '#7A3A0E' : '#3E1A08'; ctx.fill();

    if (!lit) return;

    // flame
    const since = T - d.litAt;
    const ignite = clamp(since / 0.5, 0, 1);
    const flick = 0.86 + 0.09 * Math.sin(T * 13 + d.ph) + 0.06 * Math.sin(T * 23 + d.ph * 2) + Math.random() * 0.03;
    const boost = 1 + d.flare * 0.9;
    const fh = s * 0.55 * flick * boost * ignite, fw = s * 0.12 * (0.9 + 0.2 * ignite) * Math.min(boost, 1.4);
    const sway = Math.sin(T * 3 + d.ph) * fw * 0.45;
    const fx = tipX, fy = tipY - 1;

    ctx.globalCompositeOperation = 'lighter';
    glow(ctx, 3, fx, fy - fh * 0.4, s * 3.4 * flick * boost, 0.5 * ignite);
    glow(ctx, 0, fx, fy - fh * 0.35, s * 1.4 * flick, 0.7 * ignite);

    const fg = ctx.createLinearGradient(0, fy, 0, fy - fh);
    fg.addColorStop(0,   'rgba(255,255,245,1)');
    fg.addColorStop(0.3, 'rgba(255,224,138,1)');
    fg.addColorStop(0.7, 'rgba(255,150,46,.95)');
    fg.addColorStop(1,   'rgba(255,80,20,.4)');
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.moveTo(fx - fw, fy);
    ctx.bezierCurveTo(fx - fw, fy - fh * 0.5, fx + sway * 0.6, fy - fh * 0.72, fx + sway, fy - fh);
    ctx.bezierCurveTo(fx + sway * 0.6, fy - fh * 0.72, fx + fw, fy - fh * 0.5, fx + fw, fy);
    ctx.quadraticCurveTo(fx, fy + fw * 1.1, fx - fw, fy);
    ctx.fillStyle = fg; ctx.fill();
    // white core
    ctx.beginPath();
    ctx.ellipse(fx + sway * 0.2, fy - fh * 0.22, fw * 0.4, fh * 0.2, 0, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,250,.9)'; ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawLantern(l) {
    const { x, y, s } = l;
    const flick = 0.9 + 0.1 * Math.sin(T * 9 + l.ph);
    ctx.globalCompositeOperation = 'lighter';
    glow(ctx, 3, x, y + s * 0.2, s * 5.5, 0.32 * l.a * flick);
    ctx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(T * 0.8 + l.ph) * 0.06);
    const gr = ctx.createRadialGradient(0, s * 0.45, 0, 0, s * 0.3, s * 1.1);
    gr.addColorStop(0,    '#FFF4C2');
    gr.addColorStop(0.35, '#FFB347');
    gr.addColorStop(1,    '#B8321A');
    ctx.globalAlpha = l.a;
    ctx.beginPath();
    ctx.moveTo(-s * 0.45, -s * 0.6);
    ctx.lineTo( s * 0.45, -s * 0.6);
    ctx.quadraticCurveTo( s * 0.44, 0,  s * 0.32, s * 0.6);
    ctx.lineTo(-s * 0.32, s * 0.6);
    ctx.quadraticCurveTo(-s * 0.44, 0, -s * 0.45, -s * 0.6);
    ctx.closePath();
    ctx.fillStyle = gr; ctx.fill();
    ctx.fillStyle = 'rgba(90,20,10,.8)';
    ctx.fillRect(-s * 0.33, s * 0.56, s * 0.66, s * 0.08);
    ctx.restore();
  }

  /* =========================================================
     Main loop
     ========================================================= */
  let last = performance.now();
  let nextAuto = 2.2, nextLantern = 0.8;

  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    T += dt;
    const slow = reduceMotion ? 0.35 : 1;
    const mode = activePattern();

    // --- spawners ---
    if (state.autoFw && T > nextAuto) {
      launch(rand(W * 0.15, W * 0.85), rand(H * 0.1, H * 0.4));
      if (Math.random() < 0.3) launch(rand(W * 0.15, W * 0.85), rand(H * 0.1, H * 0.4));
      nextAuto = T + rand(1.3, 3.4);
    }
    const maxLanterns = reduceMotion ? 5 : 12;
    if (T > nextLantern && lanterns.length < maxLanterns) {
      const s = rand(12, 30);
      lanterns.push({ x: rand(W * 0.08, W * 0.92), y: H + 60, s, vy: s * rand(1.1, 1.6) * slow, ph: rand(0, TAU), a: 0.45 + (s / 30) * 0.5 });
      lanterns.sort((a, b) => a.s - b.s);
      nextLantern = T + rand(1.5, 3.2);
    }

    // --- background ---
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(bg, 0, 0, W, H);

    // stars
    ctx.fillStyle = '#FFF6E6';
    for (const s of stars) {
      ctx.globalAlpha = 0.25 + 0.6 * (0.5 + 0.5 * Math.sin(T * s.sp * slow + s.ph));
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }

    // twinkling LED field
    ctx.globalCompositeOperation = 'lighter';
    for (const b of bokeh) {
      const v = Math.sin(T * b.sp * slow + b.ph);
      let a;
      if (b.blink) a = v > 0.55 ? b.a : b.a * 0.08;
      else { const tw = 0.5 + 0.5 * v; a = b.a * (0.15 + 0.85 * tw * tw); }
      if (b.vy) { b.y += b.vy * dt; if (b.y < -b.s) b.y = H + b.s; }
      glow(ctx, b.c, b.x, b.y, b.s, a);
    }

    // rangoli
    const rIn = clamp(T / 3, 0, 1);
    ctx.save();
    ctx.translate(W / 2, H * 0.47);
    ctx.rotate(T * 0.025 * slow);
    ctx.globalAlpha = (0.14 + 0.04 * Math.sin(T * 0.8)) * rIn;
    ctx.drawImage(rg, -R, -R, R * 2, R * 2);
    ctx.restore();

    // sky lanterns
    for (let i = lanterns.length - 1; i >= 0; i--) {
      const l = lanterns[i];
      l.y -= l.vy * dt;
      l.x += Math.sin(T * 0.5 + l.ph) * 8 * dt;
      if (l.y < -80) { lanterns.splice(i, 1); continue; }
      drawLantern(l);
    }

    // --- fireworks layer (with fading trails) ---
    fctx.globalCompositeOperation = 'destination-out';
    fctx.globalAlpha = 1;
    fctx.fillStyle = `rgba(0,0,0,${Math.min(1, 0.22 * dt * 60)})`;
    fctx.fillRect(0, 0, W, H);
    fctx.globalCompositeOperation = 'lighter';

    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.t += dt;
      const p = Math.min(1, r.t / r.d), e = 1 - (1 - p) * (1 - p);
      r.x = r.sx + (r.tx - r.sx) * e + Math.sin(T * 20 + r.wob) * 1.2;
      r.y = r.sy + (r.ty - r.sy) * e;
      glow(fctx, 0, r.x, r.y, 14, 1);
      if (Math.random() < 0.8) addPart({ x: r.x, y: r.y, vx: rand(-15, 15), vy: rand(10, 40), life: 0.45, max: 0.45, c: 0, size: 6, drag: 0.96, g: 60, flick: true });
      if (p >= 1) { explode(r.x, r.y); rockets.splice(i, 1); }
    }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      const k = Math.pow(p.drag, dt * 60);
      p.vx *= k; p.vy = p.vy * k + p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      let a = p.life / p.max;
      if (p.flick && Math.random() < 0.3) a *= 0.25;
      glow(fctx, p.c, p.x, p.y, p.size * (0.55 + 0.45 * a), a);
    }

    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1;
    ctx.drawImage(fwc, 0, 0, W, H);

    // --- hanging light strings ---
    for (const s of swags) {
      const cy = s.cy + Math.sin(T * 0.7 * slow + s.ph) * 4;
      s.cyNow = cy;
      const n = s.bulbs.length;
      for (let k = 0; k < n; k++) {
        const t = (k + 0.5) / n, u = 1 - t;
        s.px[k] = u * u * s.ax + 2 * u * t * s.cx + t * t * s.bx;
        s.py[k] = u * u * s.ay + 2 * u * t * cy + t * t * s.by;
      }
    }
    for (const c of curtains) {
      for (let k = 0; k < c.n; k++) {
        const y = (k + 1) * c.gap, f = y / c.len;
        c.px[k] = c.x + Math.sin(T * 0.9 * slow + c.ph + f * 2) * 7 * f * f;
        c.py[k] = y;
      }
    }

    // wires
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = '#3A2414';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    for (const s of swags) { ctx.moveTo(s.ax, s.ay); ctx.quadraticCurveTo(s.cx, s.cyNow, s.bx, s.by); }
    for (const c of curtains) { ctx.moveTo(c.x, 0); for (let k = 0; k < c.n; k++) ctx.lineTo(c.px[k], c.py[k]); }
    ctx.stroke();

    // bulbs
    ctx.globalCompositeOperation = 'lighter';
    for (const s of swags) {
      for (let k = 0; k < s.bulbs.length; k++) drawBulb(s.px[k], s.py[k], s.scale, mode, k, s.si, s.bulbs[k], k * 1.7 + s.si);
    }
    for (const c of curtains) {
      for (let k = 0; k < c.n; k++) drawBulb(c.px[k], c.py[k], 0.9, mode, k, c.si, c.c, k * 2.3 + c.si * 0.7);
    }

    // --- ground and diyas ---
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    const gTop = H - 150;
    const gg = ctx.createLinearGradient(0, gTop, 0, H);
    gg.addColorStop(0, 'rgba(28,8,26,0)');
    gg.addColorStop(0.6, 'rgba(28,8,26,.75)');
    gg.addColorStop(1, 'rgba(18,4,16,.95)');
    ctx.fillStyle = gg; ctx.fillRect(0, gTop, W, 150);

    for (const d of diyas) {
      if (d.flare > 0) d.flare = Math.max(0, d.flare - dt * 0.8);
      drawDiya(d);
      if (T >= d.litAt && T - d.litAt < dt * 1.5) sparkle(d.x + d.s * 0.62, d.y - d.s * 0.2, 10, 0.6, 30);
    }

    // sparkler glow at the pointer
    if (T - pointer.lastMove < 1.2) {
      ctx.globalCompositeOperation = 'lighter';
      glow(ctx, 6, pointer.x, pointer.y, 36, 0.8 * (1 - (T - pointer.lastMove) / 1.2));
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  /* =========================================================
     Interaction
     ========================================================= */
  sky.addEventListener('pointerdown', e => {
    const x = e.clientX, y = e.clientY;
    for (const d of diyas) {
      const dx = x - d.x, dy = y - (d.y - d.s * 0.2);
      if (dx * dx + dy * dy < d.s * d.s * 0.7) {
        if (T < d.litAt) d.litAt = T;
        d.flare = 1;
        sparkle(d.x + d.s * 0.62, d.y - d.s * 0.25, 40, 1.2, 120);
        return;
      }
    }
    launch(x, Math.min(y, H - 120));
  });

  let lastPX = null, lastPY = null;
  window.addEventListener('pointermove', e => {
    wake();
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.lastMove = T;
    if (lastPX !== null) {
      const dist = Math.hypot(e.clientX - lastPX, e.clientY - lastPY);
      const n = Math.min(6, Math.ceil(dist / 12));
      if (!e.target.closest || !e.target.closest('.dock')) sparkle(e.clientX, e.clientY, n, 0.6, 0);
    }
    lastPX = e.clientX; lastPY = e.clientY;
  });

  // idle hiding for unattended office screens
  let idleTimer = null;
  const dock = document.getElementById('dock');
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (!state.editing && !dock.matches(':hover') && !dock.contains(document.activeElement)) document.body.classList.add('idle');
      else wake();
    }, 3500);
    if (document.body.classList.contains('dock-open')) armDock();
  }

  // control dock: hidden until Ctrl+Esc, auto-hides after 6s without activity
  let dockTimer = null;
  function armDock() {
    clearTimeout(dockTimer);
    dockTimer = setTimeout(() => {
      if (state.editing || dock.matches(':hover')) armDock(); else hideDock();
    }, 6000);
  }
  function showDock() { document.body.classList.add('dock-open'); armDock(); }
  function hideDock() {
    clearTimeout(dockTimer);
    document.body.classList.remove('dock-open');
    if (dock.contains(document.activeElement)) document.activeElement.blur();
  }
  function toggleDock() {
    document.body.classList.contains('dock-open') ? hideDock() : showDock();
  }

  const $ = id => document.getElementById(id);
  function setLabel(btn, text) { btn.firstChild.nodeValue = text + ' '; }

  function toggleAuto() {
    state.autoFw = !state.autoFw;
    $('bAuto').setAttribute('aria-pressed', state.autoFw);
    setLabel($('bAuto'), 'Auto fireworks: ' + (state.autoFw ? 'on' : 'off'));
    if (state.autoFw) nextAuto = T + 0.4;
  }
  function cyclePattern() {
    state.pattern = PATTERNS[(PATTERNS.indexOf(state.pattern) + 1) % PATTERNS.length];
    setLabel($('bLights'), 'Lights: ' + PATTERN_NAMES[state.pattern]);
  }
  function toggleText() {
    state.textHidden = !state.textHidden;
    $('greeting').classList.toggle('hidden', state.textHidden);
    setLabel($('bHide'), state.textHidden ? 'Show message' : 'Hide message');
  }
  function toggleFull() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.();
  }
  document.addEventListener('fullscreenchange', () => {
    setLabel($('bFull'), document.fullscreenElement ? 'Exit full screen' : 'Full screen');
  });

  const msgEl = $('msg'), fromEl = $('from');
  function toggleEdit(force) {
    state.editing = typeof force === 'boolean' ? force : !state.editing;
    document.body.classList.toggle('editing', state.editing);
    for (const el of [msgEl, fromEl]) el.contentEditable = state.editing ? 'true' : 'false';
    setLabel($('bEdit'), state.editing ? 'Save message' : 'Edit message');
    if (state.editing) {
      if (state.textHidden) toggleText();
      msgEl.focus();
    } else {
      try {
        localStorage.setItem('diwali.msg', msgEl.textContent.trim());
        localStorage.setItem('diwali.from', fromEl.textContent.trim());
      } catch (_) { /* storage unavailable: message still shows for this session */ }
      document.activeElement && document.activeElement.blur();
    }
  }
  [msgEl, fromEl].forEach(el => el.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); toggleEdit(false); }
  }));

  $('bFinale').addEventListener('click', finale);
  $('bAuto').addEventListener('click', toggleAuto);
  $('bLights').addEventListener('click', cyclePattern);
  $('bEdit').addEventListener('click', () => toggleEdit());
  $('bHide').addEventListener('click', toggleText);
  $('bFull').addEventListener('click', toggleFull);

  window.addEventListener('keydown', e => {
    wake();
    if (e.ctrlKey && e.key === 'Escape') { e.preventDefault(); toggleDock(); return; }
    if (e.target.isContentEditable) { if (e.key === 'Escape') toggleEdit(false); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (e.code === 'Space') { e.preventDefault(); finale(); }
    else if (k === 'a') toggleAuto();
    else if (k === 'l') cyclePattern();
    else if (k === 'e') { e.preventDefault(); toggleEdit(); }
    else if (k === 'h') toggleText();
    else if (k === 'f') toggleFull();
  });

  /* =========================================================
     Init
     ========================================================= */
  // restore a saved message
  try {
    const m = localStorage.getItem('diwali.msg'), f = localStorage.getItem('diwali.from');
    if (m) msgEl.textContent = m;
    if (f) fromEl.textContent = f;
  } catch (_) {}

  // split the title so each letter lights up like a lamp
  const title = $('title');
  const text = title.textContent;
  title.setAttribute('aria-label', text);
  title.textContent = '';
  [...text].forEach((ch, i) => {
    const s = document.createElement('span');
    s.setAttribute('aria-hidden', 'true');
    s.textContent = ch === ' ' ? '\u00A0' : ch;
    s.style.animationDelay = (0.5 + i * 0.11) + 's';
    title.appendChild(s);
  });

  // alternate the greeting between Hindi and Bangla
  const hiLines = document.querySelectorAll('.hi-line');
  let hiIdx = 0;
  setInterval(() => {
    hiLines[hiIdx].classList.remove('show'); hiLines[hiIdx].setAttribute('aria-hidden', 'true');
    hiIdx = (hiIdx + 1) % hiLines.length;
    hiLines[hiIdx].classList.add('show'); hiLines[hiIdx].removeAttribute('aria-hidden');
  }, 5000);

  if (!state.autoFw) { $('bAuto').setAttribute('aria-pressed', 'false'); setLabel($('bAuto'), 'Auto fireworks: off'); }

  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
  resize();
  wake();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
